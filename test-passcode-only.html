<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Test</title>
<style>
  body{
    font-family: sans-serif;
    background: #FFFDFC;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .pw-card{
    background: #fff;
    border-radius: 26px;
    padding: 2.4rem 1.8rem 2.1rem;
    max-width: 320px;
    width: 84vw;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
  .pw-title{
    font-weight: 700;
    font-size: 1.5rem;
    color: #333;
    margin-bottom: 0.4rem;
  }
  .pw-sub{
    color: #E385AA;
    margin-bottom: 1.8rem;
  }
  #pwInput{
    width: 100%;
    padding: 12px 18px;
    border-radius: 30px;
    border: 1.5px solid #ccc;
    font-size: 0.95rem;
    text-align: center;
    margin-bottom: 1rem;
    box-sizing: border-box;
  }
  #pwSubmit{
    padding: 11px 34px;
    border-radius: 30px;
    border: none;
    background: #E385AA;
    color: #fff;
    font-weight: 600;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="pw-card">
  <div class="pw-title">TEST: can you see this title?</div>
  <div class="pw-sub">TEST: and this subtitle?</div>
  <input type="password" id="pwInput" placeholder="passcode">
  <br>
  <button type="button" id="pwSubmit">TEST BUTTON</button>
</div>

</body>
</html>
