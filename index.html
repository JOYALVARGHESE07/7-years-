<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7 Years of Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFDFC;
    --blush:#FCE6EE;
    --pink:#F3A9C4;
    --pink-deep:#E385AA;
    --silver:#D9DEE3;
    --silver-deep:#AEB6BD;
    --ink:#4A4048;
    --ink-soft:#8A7E85;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{
    scroll-snap-type:y proximity;
    scroll-behavior:smooth;
  }
  body{
    font-family:'Quicksand', sans-serif;
    font-weight:400;
    color:var(--ink);
    background:var(--white);
    overflow-x:hidden;
  }
  ::selection{background:var(--pink); color:#fff;}

  .page{
    min-height:100svh;
    scroll-snap-align:start;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:9vh 7vw;
    position:relative;
  }

  .script{
    font-family:'Parisienne', cursive;
    color:var(--pink-deep);
  }
  .display{
    font-family:'Playfair Display', serif;
  }

  .chapter-head{
    display:flex;
    align-items:baseline;
    gap:0.6rem;
    margin-bottom:1.2rem;
    opacity:0;
    position:relative;
    z-index:2;
  }
